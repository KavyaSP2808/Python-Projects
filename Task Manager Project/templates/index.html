<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <h1 class="title">Task Manager</h1>

    <!-- Stats Dashboard -->
    <div class="stats">
        <div class="card">
            <h3>Total</h3>
            <p>{{ total }}</p>
        </div>
        <div class="card completed">
            <h3>Completed</h3>
            <p>{{ completed }}</p>
        </div>
        <div class="card pending">
            <h3>Pending</h3>
            <p>{{ pending }}</p>
        </div>
    </div>

    <!-- Add Task Form -->
    <form action="/add" method="POST" class="task-form">
        <input type="text" name="title" placeholder="Enter new task..." required>
        <button type="submit">Add Task</button>
    </form>

    <!-- Task List -->
    <ul class="task-list">
        {% for task in tasks %}
        <li class="task-item {% if task.completed %}done{% endif %}">
            <span>{{ task.title }}</span>
            <div class="actions">
                <a href="{{ url_for('complete_task', task_id=task.id) }}" class="btn complete">✓</a>
                <a href="{{ url_for('delete_task', task_id=task.id) }}" class="btn delete">🗑</a>
            </div>
        </li>
        {% else %}
        <p class="empty">No tasks yet. Add one above 👆</p>
        {% endfor %}
    </ul>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
